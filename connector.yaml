version: "1.0"
specification:
  name: elasticsearch
  summary: An Elasticsearch destination plugin for Conduit.
  description: The Conduit plugin supporting Elasticsearch destination.
  version: v0.5.0
  author: Miquido, Meroxa, Inc.
  source:
    parameters:
      - name: host
        description: 'The Elasticsearch host and port (e.g.: http://127.0.0.1:9200).'
        type: string
        default: ""
        validations:
          - type: required
            value: ""
      - name: version
        description: 'The version of the Elasticsearch service. One of: 5, 6, 7, 8.'
        type: string
        default: ""
        validations:
          - type: required
            value: ""
      - name: APIKey
        description: Base64-encoded token for authorization; if set, overrides username/password and service token.
        type: string
        default: ""
        validations: []
      - name: batchSize
        description: The number of items stored in bulk in the index. The minimum value is `1`, maximum value is `10000`.
        type: int
        default: "1000"
        validations: []
      - name: certificateFingerprint
        description: SHA256 hex fingerprint given by Elasticsearch on first launch.
        type: string
        default: ""
        validations: []
      - name: cloudID
        description: Endpoint for the Elastic Service (https://elastic.co/cloud).
        type: string
        default: ""
        validations: []
      - name: indexes.*.sortBy
        description: The sortby field for each index to be used by elasticsearch search api.
        type: string
        default: _seq_no
        validations: []
      - name: indexes.*.sortOrder
        description: The sortOrder(asc or desc) for each index to be used by elasticsearch search api.
        type: string
        default: asc
        validations: []
      - name: password
        description: The password for HTTP Basic Authentication.
        type: string
        default: ""
        validations: []
      - name: pollingPeriod
        description: This period is used by workers to poll for new data at regular intervals.
        type: duration
        default: 5s
        validations: []
      - name: retries
        description: The maximum number of retries of failed operations.
        type: int
        default: "0"
        validations: []
      - name: serviceToken
        description: Service token for authorization; if set, overrides username/password.
        type: string
        default: ""
        validations: []
      - name: username
        description: The username for HTTP Basic Authentication.
        type: string
        default: ""
        validations: []
      - name: sdk.batch.delay
        description: Maximum delay before an incomplete batch is read from the source.
        type: duration
        default: "0"
        validations: []
      - name: sdk.batch.size
        description: Maximum size of batch before it gets read from the source.
        type: int
        default: "0"
        validations:
          - type: greater-than
            value: "-1"
      - name: sdk.schema.context.enabled
        description: |-
          Specifies whether to use a schema context name. If set to false, no schema context name will
          be used, and schemas will be saved with the subject name specified in the connector
          (not safe because of name conflicts).
        type: bool
        default: "true"
        validations: []
      - name: sdk.schema.context.name
        description: |-
          Schema context name to be used. Used as a prefix for all schema subject names.
          If empty, defaults to the connector ID.
        type: string
        default: ""
        validations: []
      - name: sdk.schema.extract.key.enabled
        description: Whether to extract and encode the record key with a schema.
        type: bool
        default: "false"
        validations: []
      - name: sdk.schema.extract.key.subject
        description: |-
          The subject of the key schema. If the record metadata contains the field
          "opencdc.collection" it is prepended to the subject name and separated
          with a dot.
        type: string
        default: key
        validations: []
      - name: sdk.schema.extract.payload.enabled
        description: Whether to extract and encode the record payload with a schema.
        type: bool
        default: "true"
        validations: []
      - name: sdk.schema.extract.payload.subject
        description: |-
          The subject of the payload schema. If the record metadata contains the
          field "opencdc.collection" it is prepended to the subject name and
          separated with a dot.
        type: string
        default: payload
        validations: []
      - name: sdk.schema.extract.type
        description: The type of the payload schema.
        type: string
        default: avro
        validations:
          - type: inclusion
            value: avro
  destination:
    parameters:
      - name: host
        description: 'The Elasticsearch host and port (e.g.: http://127.0.0.1:9200).'
        type: string
        default: ""
        validations:
          - type: required
            value: ""
      - name: version
        description: 'The version of the Elasticsearch service. One of: 5, 6, 7, 8.'
        type: string
        default: ""
        validations:
          - type: required
            value: ""
      - name: APIKey
        description: Base64-encoded token for authorization; if set, overrides username/password and service token.
        type: string
        default: ""
        validations: []
      - name: bulkSize
        description: |-
          Deprecated: use `sdk.batch.size`. The number of items stored in one bulk
          request (the minimum value is `1`, the maximum value is `10 000`). This
          config was never read in the write path, so its old default of 1000 did
          nothing. It is now honored as a backward-compatible alias for
          `sdk.batch.size` when explicitly set (non-zero): a pipeline that set it
          keeps its intended batch size. It has no default; leave it unset to use
          `sdk.batch.size` (default 1000).
        type: int
        default: ""
        validations: []
      - name: certificateFingerprint
        description: SHA256 hex fingerprint given by Elasticsearch on first launch.
        type: string
        default: ""
        validations: []
      - name: cloudID
        description: Endpoint for the Elastic Service (https://elastic.co/cloud).
        type: string
        default: ""
        validations: []
      - name: index
        description: The name of the index to write the data to.
        type: string
        default: '{{ index .Metadata "opencdc.collection" }}'
        validations: []
      - name: password
        description: The password for HTTP Basic Authentication.
        type: string
        default: ""
        validations: []
      - name: retries
        description: The maximum number of retries of failed operations. The minimum value is `0` which disabled retry logic. The maximum value is `255.
        type: int
        default: "0"
        validations: []
      - name: serviceToken
        description: Service token for authorization; if set, overrides username/password.
        type: string
        default: ""
        validations: []
      - name: type
        description: The name of the index's type to write the data to.
        type: string
        default: ""
        validations: []
      - name: username
        description: The username for HTTP Basic Authentication.
        type: string
        default: ""
        validations: []
      - name: sdk.batch.delay
        description: Maximum delay before an incomplete batch is written to the destination.
        type: duration
        default: 1s
        validations: []
      - name: sdk.batch.size
        description: Maximum size of batch before it gets written to the destination.
        type: int
        default: "1000"
        validations:
          - type: greater-than
            value: "-1"
      - name: sdk.rate.burst
        description: |-
          Allow bursts of at most X records (0 or less means that bursts are not
          limited). Only takes effect if a rate limit per second is set. Note that
          if `sdk.batch.size` is bigger than `sdk.rate.burst`, the effective batch
          size will be equal to `sdk.rate.burst`.
        type: int
        default: "0"
        validations:
          - type: greater-than
            value: "-1"
      - name: sdk.rate.perSecond
        description: Maximum number of records written per second (0 means no rate limit).
        type: float
        default: "0"
        validations:
          - type: greater-than
            value: "-1"
      - name: sdk.record.format
        description: |-
          The format of the output record. See the Conduit documentation for a full
          list of supported formats (https://conduitdata.io/docs/using/connectors/configuration-parameters/output-format).
        type: string
        default: opencdc/json
        validations: []
      - name: sdk.record.format.options
        description: |-
          Options to configure the chosen output record format. Options are normally
          key=value pairs separated with comma (e.g. opt1=val2,opt2=val2), except
          for the `template` record format, where options are a Go template.
        type: string
        default: ""
        validations: []
      - name: sdk.schema.extract.key.enabled
        description: Whether to extract and decode the record key with a schema.
        type: bool
        default: "true"
        validations: []
      - name: sdk.schema.extract.payload.enabled
        description: Whether to extract and decode the record payload with a schema.
        type: bool
        default: "true"
        validations: []
